<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atelier d'écriture</title>
  <meta name="description" content="Ton atelier personnel pour écrire des nouvelles et des romans : dossiers, personnages, fil rouge, idées, vérifications et entraînement quotidien.">
  <meta name="theme-color" content="#f7f2e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Atelier">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Accueil">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Atelier</span>
    </a>
    <nav class="mainnav" aria-label="Navigation principale">
      <a href="#/" data-nav="home">Accueil</a>
      <a href="#/dossiers" data-nav="dossiers">Dossiers</a>
      <a href="#/entrainement" data-nav="entrainement">Entraînement</a>
      <a href="#/reglages" data-nav="reglages">Réglages</a>
    </nav>
    <span id="saveState" class="save-state" aria-live="polite"></span>
  </header>

  <main id="main" tabindex="-1">
    <div class="loading">Ouverture de l'atelier…</div>
  </main>

  <nav class="bottomnav" aria-label="Navigation">
    <a href="#/" data-nav="home"><span data-icon="home"></span>Accueil</a>
    <a href="#/dossiers" data-nav="dossiers"><span data-icon="folder"></span>Dossiers</a>
    <a href="#/entrainement" data-nav="entrainement"><span data-icon="flame"></span>Entraînement</a>
    <a href="#/reglages" data-nav="reglages"><span data-icon="sliders"></span>Réglages</a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>

  <script src="js/store.js"></script>
  <script src="js/prompts.js"></script>
  <script src="js/check.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
